<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Trip Upcoming</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f0f2f5; }
        h2 { color: #333; text-align: center; margin-bottom: 30px; }

        /* --- TAMBAHAN STYLE UNTUK SWITCHER --- */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background-color: #ddd;
            color: #555;
            transition: 0.3s;
        }
        .tab-btn.active-tab {
            background-color: #007bff;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .tab-content {
            display: none; /* Sembunyikan konten secara default */
            animation: fadeIn 0.5s;
        }
        .tab-content.active-content {
            display: block; /* Tampilkan konten aktif */
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* ------------------------------------- */

        /* --- Header Controls --- */
        .controls { text-align: center; margin-bottom: 20px; }
        .btn-restore {
            background-color: #6c757d; color: white; border: none; padding: 8px 16px;
            border-radius: 5px; cursor: pointer; font-size: 14px;
        }
        .btn-restore:hover { background-color: #5a6268; }

        .accordion {
            background-color: #ffffff; color: #444; cursor: pointer; padding: 18px;
            width: 100%; border: none; text-align: left; outline: none; font-size: 16px;
            transition: 0.4s; border-radius: 8px; margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex;
            justify-content: space-between; align-items: center; border-left: 5px solid #2c3e50;
        }

        .accordion:hover, .active { background-color: #e6f7ff; border-left: 5px solid #007bff; }

        .badge { background-color: #eee; padding: 5px 10px; border-radius: 15px; font-size: 0.85em; color: #555; }

        .panel {
            padding: 0 18px; background-color: white; max-height: 0; overflow: hidden;
            transition: max-height 0.2s ease-out; margin-bottom: 10px; border-radius: 0 0 8px 8px;
        }

        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.95em; }
        th { text-align: left; background-color: #f8f9fa; color: #666; padding: 10px; border-bottom: 2px solid #ddd; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        .btn-wa {
            background-color: #25D366; color: white; padding: 6px 12px; text-decoration: none;
            border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block;
            transition: background-color 0.3s; margin-right: 5px;
        }
        .btn-wa:hover { background-color: #128C7E; }

        /* Tombol Hapus Merah */
        .btn-del {
            background-color: #ff4d4d; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn-del:hover { background-color: #cc0000; }

        #container-wrapper { max-width: 800px; margin: auto; }
        .status { text-align: center; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>📅 Jadwal Trip Mendatang</h2>

    <div class="tab-container">
        <button class="tab-btn active-tab" onclick="openTab(event, 'jadwal1')">Songkopek</button>
        <button class="tab-btn" onclick="openTab(event, 'jadwal2')">Coban Canggu</button>
    </div>

    <div class="controls">
        <button onclick="resetHiddenData()" class="btn-restore">🔄 Munculkan Semua Data Terhapus</button>
    </div>

    <div id="container-wrapper">
        <div id="jadwal1" class="tab-content active-content">
            <div class="status">Memuat data Songkopek...</div>
        </div>

        <div id="jadwal2" class="tab-content">
            <div class="status">Memuat data Coban Canggu...</div>
        </div>
    </div>

    <script>
        // --- MASUKKAN 2 LINK SPREADSHEET DISINI ---
        const urlSpreadsheet1 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSR5z3TdydX6DojM-howYBJ1-r_A48qO_rwpk6QLe0rbT6gv_5acHaTZ0GvrGfFiynRYJVcW-HefI4o/pub?output=csv';
        const urlSpreadsheet2 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRq_DvPn5HBnJ__rVDmJ0vN7Vo9kNqwrrgpeg8diyegbVtaYaNogSIvNSiE25hGACoh4Og55Z7DwEzL/pub?output=csv'; // <-- Ganti ini dengan link kedua

        const kolomDicari = [
            "Tanggal trip", 
            "Nama", 
            "wa.me",        
            "Jumlah peserta"
        ];

        // --- FUNGSI TAB SWITCHER ---
        function openTab(evt, tabName) {
            var i, tabContent, tabBtns;
            
            // Sembunyikan semua konten
            tabContent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabContent.length; i++) {
                tabContent[i].style.display = "none";
                tabContent[i].classList.remove("active-content");
            }

            // Hapus class active dari tombol
            tabBtns = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabBtns.length; i++) {
                tabBtns[i].className = tabBtns[i].className.replace(" active-tab", "");
            }

            // Tampilkan tab yang dipilih
            document.getElementById(tabName).style.display = "block";
            setTimeout(() => { document.getElementById(tabName).classList.add("active-content"); }, 10);
            evt.currentTarget.className += " active-tab";
        }

        // --- LOCAL STORAGE LOGIC (Tetap Sama) ---
        const STORAGE_KEY = 'hidden_trips_data';
        
        function getHiddenData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function addToHidden(uniqueId) {
            let currentData = getHiddenData();
            if (!currentData.includes(uniqueId)) {
                currentData.push(uniqueId);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
            }
        }

        function resetHiddenData() {
            if(confirm("Apakah Anda yakin ingin memunculkan kembali semua data yang dihapus?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // Generate ID unik
        function generateId(row, mapIndex) {
            const tgl = row[mapIndex["Tanggal trip"]] || "nodate";
            const nama = row[mapIndex["Nama"]] || "noname";
            const wa = row[mapIndex["wa.me"]] || "nowa";
            return `${tgl}_${nama}_${wa}`.replace(/\s/g, '').toLowerCase();
        }

        const mapBulan = {
            "januari": 0, "jan": 0, "februari": 1, "feb": 1, "maret": 2, "mar": 2,
            "april": 3, "apr": 3, "mei": 4, "may": 4, "juni": 5, "jun": 5,
            "juli": 6, "jul": 6, "agustus": 7, "agu": 7, "aug": 7,
            "september": 8, "sep": 8, "oktober": 9, "okt": 9, "oct": 9,
            "november": 10, "nov": 10, "desember": 11, "des": 11, "dec": 11
        };

        function parseDateIndo(str) {
            if (!str) return null;
            const cleanStr = str.trim().toLowerCase();
            const parts = cleanStr.split(/[\s-]+/); 
            if (parts.length < 3) return null;
            const day = parseInt(parts[0]);
            const monthName = parts[1]; 
            const year = parseInt(parts[2]);
            const monthIndex = mapBulan[monthName];
            if (!isNaN(day) && !isNaN(year) && monthIndex !== undefined) {
                return new Date(year, monthIndex, day);
            }
            return null; 
        }

        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentVal = '';
            let insideQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];
                if (char === '"') {
                    if (insideQuote && nextChar === '"') { currentVal += '"'; i++; } 
                    else { insideQuote = !insideQuote; }
                } else if (char === ',' && !insideQuote) {
                    currentRow.push(currentVal); currentVal = '';
                } else if ((char === '\n' || char === '\r') && !insideQuote) {
                    if (currentVal || currentRow.length > 0) currentRow.push(currentVal);
                    if (currentRow.length > 0) rows.push(currentRow);
                    currentRow = []; currentVal = '';
                    if (char === '\r' && nextChar === '\n') i++;
                } else { currentVal += char; }
            }
            if (currentVal || currentRow.length > 0) currentRow.push(currentVal);
            if (currentRow.length > 0) rows.push(currentRow);
            return rows;
        }

        // --- MODIFIKASI: loadData sekarang menerima Parameter URL dan ID Kontainer ---
        async function loadData(urlTarget, containerId) {
            try {
                const response = await fetch(urlTarget);
                const dataRaw = await response.text();
                const rows = parseCSV(dataRaw);
                const container = document.getElementById(containerId); // <-- Target sesuai parameter
                
                // Bersihkan tulisan "Memuat data..."
                container.innerHTML = ""; 

                if (rows.length === 0) {
                    container.innerHTML = '<div class="status">Data Kosong</div>';
                    return;
                }

                const headers = rows[0];
                let mapIndex = {};
                let indexTanggal = -1; 

                kolomDicari.forEach(kunci => {
                    const idx = headers.findIndex(h => h.toLowerCase().includes(kunci.toLowerCase()));
                    if (idx !== -1) {
                        mapIndex[kunci] = idx;
                        if (kunci === "Tanggal trip") indexTanggal = idx;
                    }
                });

                if (indexTanggal === -1) {
                    container.innerHTML = '<div class="status">Error: Kolom Tanggal tidak ditemukan.</div>';
                    return;
                }

                const hiddenRows = getHiddenData();
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                let groups = {};

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    
                    const uniqueId = generateId(row, mapIndex);
                    if (hiddenRows.includes(uniqueId)) {
                        continue; 
                    }

                    const tglString = row[indexTanggal] ? row[indexTanggal].trim() : "";
                    if (tglString === "") continue;

                    const tglObj = parseDateIndo(tglString);
                    if (tglObj && !isNaN(tglObj) && tglObj < today) {
                        continue; 
                    }

                    if (!groups[tglString]) {
                        groups[tglString] = {
                            dateObj: tglObj, 
                            rows: []
                        };
                    }
                    groups[tglString].rows.push(row);
                }

                const sortedKeys = Object.keys(groups).sort((a, b) => {
                    const dateA = groups[a].dateObj;
                    const dateB = groups[b].dateObj;
                    if (!dateA) return 1; 
                    if (!dateB) return -1;
                    return dateA - dateB; 
                });

                if (sortedKeys.length === 0) {
                    container.innerHTML = '<div class="status">Tidak ada trip mendatang (atau semua telah dihapus).</div>';
                    return;
                }

                // --- RENDER (LOGIKA SAMA PERSIS) ---
                sortedKeys.forEach(tglKey => {
                    const groupData = groups[tglKey];
                    const pesertaList = groupData.rows;
                    
                    let totalPax = 0;
                    const idxPax = mapIndex["Jumlah peserta"];
                    pesertaList.forEach(p => {
                        if (idxPax !== undefined && p[idxPax]) {
                            let num = parseInt(p[idxPax]);
                            if (!isNaN(num)) totalPax += num;
                        }
                    });

                    const button = document.createElement('button');
                    button.className = "accordion";
                    button.innerHTML = `
                        <strong>🗓️ ${tglKey}</strong> 
                        <span class="badge">${pesertaList.length} Grup (${totalPax} Pax)</span>
                    `;

                    const panel = document.createElement('div');
                    panel.className = "panel";

                    const table = document.createElement('table');
                    const thead = document.createElement('thead');
                    const tbody = document.createElement('tbody');

                    const trHead = document.createElement('tr');
                    kolomDicari.forEach(kunci => {
                        if (kunci === "Tanggal trip") return;
                        const th = document.createElement('th');
                        th.innerText = (kunci === "wa.me") ? "Chat" : kunci;
                        trHead.appendChild(th);
                    });
                    
                    const thAksi = document.createElement('th');
                    thAksi.innerText = "Aksi";
                    thAksi.style.textAlign = "center";
                    trHead.appendChild(thAksi);

                    thead.appendChild(trHead);

                    pesertaList.forEach(row => {
                        const tr = document.createElement('tr');
                        const rowUniqueId = generateId(row, mapIndex); 

                        kolomDicari.forEach(kunci => {
                            if (kunci === "Tanggal trip") return; 
                            
                            const td = document.createElement('td');
                            const idx = mapIndex[kunci];
                            let isi = (idx !== undefined && row[idx]) ? row[idx] : "";
                            
                            if (kunci === "wa.me") {
                                const idxPax = mapIndex["Jumlah peserta"];
                                const jumlahPax = (idxPax !== undefined && row[idxPax]) ? row[idxPax] : "-";
                                const idxNama = mapIndex["Nama"];
                                let namaPeserta = (idxNama !== undefined && row[idxNama]) ? row[idxNama] : "Kak";
                                let cleanNumber = isi.replace(/\D/g, ''); 

                                if (cleanNumber) {
                                    if (cleanNumber.startsWith('0')) cleanNumber = '62' + cleanNumber.substring(1);
                                    else if (cleanNumber.startsWith('8')) cleanNumber = '62' + cleanNumber;
                                    
                                    const teksPesan = `Halo Kak ${namaPeserta}, Terima kasih sudah memilih Trip Bersama TOS Canyoning Pacet. \n\nMengingatkan kembali untuk jadwal trip Canyoning *BESOK, ${tglKey}*.\nBerikut detail pesanan Kakak:\n\n *Total Peserta: ${jumlahPax} Orang*\n *Lokasi Meeting:* https://share.google/hRc5JkqW3mjhU2yn9 (Basecamp TOS Adventure Pacet )\n *Waktu:* 08.00 WIB ( On Time )\n\nUntuk perlengkapan yang perlu dibawa:\n 1. Baju Ganti\n 2. Jaket\n 3. Sepatu gunung/sepatu olahraga/sandal gunung\n 4. Obat-obatan pribadi\n\nMohon konfirmasi jika data sudah sesuai. Sampai jumpa besok!`;
                                    
                                    const pesanEncoded = encodeURIComponent(teksPesan);
                                    let linkWa;
                                    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                                        linkWa = `https://wa.me/${cleanNumber}?text=${pesanEncoded}`;
                                    } else {
                                        linkWa = `https://web.whatsapp.com/send?phone=${cleanNumber}&text=${pesanEncoded}`;
                                    }

                                    td.innerHTML = `<a href="${linkWa}" target="_blank" class="btn-wa">WA</a>`;
                                } else {
                                    td.innerText = "-";
                                }
                            } else {
                                td.innerText = isi;
                            }
                            tr.appendChild(td);
                        });

                        const tdAksi = document.createElement('td');
                        tdAksi.style.textAlign = "center";
                        
                        const btnDel = document.createElement('button');
                        btnDel.className = "btn-del";
                        btnDel.innerText = "Hapus";
                        btnDel.onclick = function() {
                            if(confirm("Sembunyikan pesanan ini dari tabel?")) {
                                addToHidden(rowUniqueId); 
                                tr.style.backgroundColor = "#ffe6e6";
                                setTimeout(() => {
                                    tr.remove(); 
                                }, 300);
                            }
                        };
                        
                        tdAksi.appendChild(btnDel);
                        tr.appendChild(tdAksi);

                        tbody.appendChild(tr);
                    });

                    table.appendChild(thead);
                    table.appendChild(tbody);
                    panel.appendChild(table);

                    container.appendChild(button);
                    container.appendChild(panel);

                    button.addEventListener("click", function() {
                        this.classList.toggle("active");
                        if (panel.style.maxHeight) {
                            panel.style.maxHeight = null;
                        } else {
                            panel.style.maxHeight = panel.scrollHeight + "px";
                        }
                    });
                });

            } catch (error) {
                console.error(error);
                document.getElementById(containerId).innerHTML = '<div class="status">Gagal memuat data.</div>';
            }
        }

        // PANGGIL FUNGSI UNTUK KEDUA TAB
        loadData(urlSpreadsheet1, 'jadwal1');
        loadData(urlSpreadsheet2, 'jadwal2');

    </script>
</body>
</html>
